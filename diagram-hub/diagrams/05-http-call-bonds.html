<div class="ambient" aria-hidden="true"></div>
<div class="app">
  <header class="bar glass">
    <div class="titles"><h1 id="title"></h1><p class="sub" id="subtitle"></p></div>
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <div class="ctl">
      <button class="btn" id="filesBtn" aria-expanded="false" aria-controls="filesPop" title="Files in the order the flow uses them (F)">Files ▾</button>
      <button class="btn" id="prev" aria-label="Previous step">←</button>
      <span class="counter" id="counter"></span>
      <button class="btn primary" id="next">Next →</button>
    </div>
  </header>
  <div class="files-pop" id="filesPop" role="dialog" aria-label="Files in order" hidden></div>
  <main class="stage">
    <section class="board glass" id="board" aria-label="Diagram">
      <div class="actors" id="actors"></div>
      <svg class="wires" id="wires" aria-hidden="true"></svg>
    </section>
    <aside class="explain glass" id="explain" aria-live="polite"></aside>
  </main>
</div>

 (log out) or 403 (ask for MPIN).","oneliner":"On the way back, interceptors save tokens, log what came back, and catch 'you're logged out'.","messages":[{"from":"bff","to":"adapter","label":"200 + screen JSON","kind":"return","why":"The body is a whole screen described as JSON: a screenType (which screen class) plus its data.","file":"—"},{"from":"adapter","to":"chain","label":"Headers: save auth token","kind":"return","why":"This is how login 'sticks'. The BFF sends the token in a response header, this saves it, and the onRequest you saw earlier attaches it to every later request.","file":"headers_interceptor.dart:53-83","code":{"path":"packages/services/lib/src/network/interceptors/headers_interceptor.dart","from":53,"to":82,"focus":[69,79,82],"notes":{"69":"Saves the auth token into SharedPreferences.","79":"Saves the session id the same way.","82":"Passes the response on to the next checkpoint."},"ref":"8765b81a","name":"headers_interceptor.dart","lines":[{"n":53,"t":"  Future<void> onResponse("},{"n":54,"t":"    Response response,"},{"n":55,"t":"    ResponseInterceptorHandler handler,"},{"n":56,"t":"  ) async {"},{"n":57,"t":"    final userId = response.headers.value("},{"n":58,"t":"      const String.fromEnvironment('X_USER_ID'),"},{"n":59,"t":"    );"},{"n":60,"t":"    final sessionId = response.headers.value("},{"n":61,"t":"      const String.fromEnvironment('X_SESSION_HEADER_NAME'),"},{"n":62,"t":"    );"},{"n":63,"t":"    final authToken = response.headers.value("},{"n":64,"t":"      const String.fromEnvironment('X_AUTH_HEADER_NAME'),"},{"n":65,"t":"    );"},{"n":66,"t":""},{"n":67,"t":"    /// Store the authorization token in the preference for tap & bonds"},{"n":68,"t":"    if (authToken.isNotNullOrEmpty) {"},{"n":69,"t":"      await _preferenceService.setAuthToken(authToken!);"},{"n":70,"t":"    }"},{"n":71,"t":""},{"n":72,"t":"    /// Store UserId in the preference."},{"n":73,"t":"    if (userId.isNotNullOrEmpty) {"},{"n":74,"t":"      await getIt<Aut  and 403 as 'success' (so they arrive here, not as errors). Auth then starts the logout or MPIN flow without waiting, and tags the response so CtaService knows to ignore it.","file":"auth_interceptor.dart:26-31, 49-64","code":{"path":"packages/services/lib/src/network/interceptors/auth_interceptor.dart","from":49,"to":64,"focus":[55,59],"notes":{"55":"401: the session is dead, so log out. unawaited = start it, don't wait for it.","59":"403 with the BFF's MPIN header: ask the user for their PIN."},"ref":"8765b81a","name":"auth_interceptor.dart","lines":[{"n":49,"t":"  bool _handleChallenge(Response<dynamic>? response, String requestPath) {"},{"n":50,"t":"    final authService = getIt<AuthService>();"},{"n":51,"t":""},{"n":52,"t":"    switch (response?.statusCode) {"},{"n":53,"t":"      case 401:"},{"n":54,"t":"        if (!authService.canLogout(requestPath)) return false;"},{"n":55,"t":"        unawaited(authService.logout());"},{"n":56,"t":"      case 403:"},{"n":57,"t":"        if (!_isMpinChallenge(response)) return false;"},{"n":58,"t":"        if (!authService.canShowMpin(requestPath)) return false;"},{"n":59,"t":"        unawaited(authService.showMpin());"},{"n":60,"t":"      default:"},{"n":61,"t":"        return false;"},{"n":62,"t":"    }"},{"n":63,"t":"    return true;"},{"n":64,"t":"  }"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/network/interceptors/auth_interceptor.dart:55"}}]},{"short":"Screen","title":"JSON becomes a screen","summary":"Back in CtaService, the response goes to ScreenBuilder. It picks the JSON (or an error screen for bad status codes), finds the Screen class from screenType, parses the model on a background isolate, and CtaService navigates to it.","oneliner":"HTTP's job ends at the JSON. ScreenBuilder turns that JSON into the screen you see.","messages":[{"from":"net","to":"cta","label":"Response","kind":"return","why":"fetchRequest returns the Response (or error.response if Dio threw). CtaService first checks it wasn't taken over by the Auth flow.","file":"cta_service.dart:104-108"},{"from":"cta","to":"builder","label":"buildFromResponse(response)","kind":"main","why":"Status code decides which JSON to use: 2xx uses the body, 426 shows 'please update', anything else shows the general error screen.","file":"screen_builder.dart:135-148","code":{"path":"packages/services/lib/src/screen_factory/screen_builder.dart","from":136,"to":148,"focus":[145,146,147],"notes":{"145":"Success: use the BFF's JSON.","146":"426: the app is too old, so show the upgrade screen.","147":"Anything else: our built-in error screen, never a crash."},"ref":"8765b81a","name":"screen_builder.dart","lines":[{"n":136,"t":"  Map<String, dynamic> getDataMap(DefaultScreens defaultScreens) {"},{"n":137,"t":"    final statusCode = this?.statusCode;"},{"n":138,"t":""},{"n":139,"t":"    if (statusCode == null) {"},{"n":140,"t":"      return defaultScreens.generalErrorScreen;"},{"n":141,"t":"    }"},{"n":142,"t":""},{"n":143,"t":"    try {"},{"n":144,"t":"      return switch (statusCode) {"},{"n":145,"t":"        >= 200 && < 300 => this!.data as Map<String, dynamic>,"},{"n":146,"t":"        426 => defaultScreens.appUpgradeScreen,"},{"n":147,"t":"        _ => defaultScreens.generalErrorScreen,"},{"n":148,"t":"      };"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/screen_factory/screen_builder.dart:145"}},{"from":"builder","to":"builder","label":"screenType → Screen, parse on isolate","kind":"main","why":"New term: isolate. A separate Dart worker with its own memory, like running work on a background thread so the UI doesn't stutter. Parsing big JSON there keeps scrolling smooth.","file":"screen_builder.dart:29-48","code":{"path":"packages/services/lib/src/screen_factory/screen_builder.dart","from":29,"to":48,"focus":[34,48],"notes":{"34":"screenType string → the Screen class (ScreenMapper). An unknown type falls back to an error screen.","48":"Freezed fromJson runs on a background isolate."},"ref":"8765b81a","name":"screen_builder.dart","lines":[{"n":29,"t":"    final screenTypeString ="},{"n":30,"t":"        map['screenType'] as String? ??"},{"n":31,"t":"        const ScreenType.generalErrorScreen().name;"},{"n":32,"t":""},{"n":33,"t":"    try {"},{"n":34,"t":"      screen = ScreenMapper.getScreen(ScreenType.fromName(screenTypeString));"},{"n":35,"t":"    } catch (_) {"},{"n":36,"t":"      screen = ScreenMapper.getScreen(const ScreenType.generalErrorScreen());"},{"n":37,"t":"      errorType = _ErrorType.featureNotSupported;"},{"n":38,"t":"    }"},{"n":39,"t":""},{"n":40,"t":"    final dataMap = switch (errorType) {"},{"n":41,"t":"      _ErrorType.none => map,"},{"n":42,"t":"      _ErrorType.generalError => _defaultScreens.generalErrorScreen,"},{"n":43,"t":"      _ErrorType.featureNotSupported =>"},{"n":44,"t":"        _defaultScreens.featureNotSupportedScreen,"},{"n":45,"t":"    };"},{"n":46,"t":""},{"n":47,"t":"    try {"},{"n":48,"t":"      model = await Isolate.run(() => screen.getModel(dataMap));"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/screen_factory/screen_builder.dart:34"}},{"from":"cta","to":"user","label":"navigate(screen)","kind":"return","why":"The new screen is pushed. If the response wasn't valid, the retry call is registered so the error screen's Retry button can repeat this whole journey.","file":"cta_service.dart:125-133","code":{"path":"packages/services/lib/src/cta/cta_service.dart","from":125,"to":134,"focus":[126,129,132],"notes":{"126":"ScreenBuilder from the previous arrows.","129":"Show it.","132":"Bad response: remember how to retry."},"ref":"8765b81a","name":"cta_service.dart","lines":[{"n":125,"t":"          } else {"},{"n":126,"t":"            final screen = await _screenBuilder.buildFromResponse(response);"},{"n":127,"t":""},{"n":128,"t":"            final navigationStyle = _getNavigationStyle(screen, cta);"},{"n":129,"t":"            _navigationService.navigate(screen, navigationStyle);"},{"n":130,"t":""},{"n":131,"t":"            if (response.isNotValidResponse) {"},{"n":132,"t":"              _retryController.registerRetryCall(retryCall);"},{"n":133,"t":"            }"},{"n":134,"t":"          }"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/cta/cta_service.dart:126"}}]}]};

<script>
(function () {
  var D = window.EXPLAINER;
  document.documentElement.dataset.theme = D.theme || "linen";
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ICONS = {
    person: '<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    app: '<rect x="6" y="3" width="12" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    os: '<rect x="4" y="5" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 21h6M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    cloud: '<path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17 18H7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    server: '<rect x="4" y="4" width="16" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="16" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7.5h.01M8 16.5h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
    bell: '<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2Zm4 4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
    door: '<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    route: '<circle cx="6" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    key: '<circle cx="8" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="m11 12 8-8m-3 3 2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    inbox: '<path d="M4 13h4l2 3h4l2-3h4M5 5h14l1 8v6H4v-6l1-8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
  };

  document.title = D.title;
  $('title').textContent = D.title;
  $('subtitle').textContent = D.subtitle || '';

  var steps = D.steps;
  var cur = 0;
  var actorIndex = {};
  D.actors.forEach(function (a, i) { actorIndex[a.id] = i; });

  // Actor cards
  var actorsEl = $('actors');
  if (D.actors.length > 6) actorsEl.classList.add('many');
  actorsEl.style.gridTemplateColumns = 'repeat(' + D.actors.length + ', minmax(0, 1fr))';
  D.actors.forEach(function (a) {
    var card = document.createElement('div');
    card.className = 'actor tone-' + (a.tone || 'person');
    card.id = 'actor-' + a.id;
    card.innerHTML = '<div class="ic"><svg viewBox="0 0 24 24">' + (ICONS[a.icon] || ICONS.app) + '</svg></div>' +
      '<div class="name"></div><div class="about"></div>';
    card.querySelector('.name').textContent = a.name.replace(/([a-z])([A-Z])/g, '$1​$2');
    card.querySelector('.about').textContent = a.about || '';
    actorsEl.appendChild(card);
  });

  // Step pills
  var stepsEl = $('steps');
  steps.forEach(function (s, i) {
    var b = document.createElement('button');
    b.className = 'pill';
    b.innerHTML = '<span class="n">' + i + '</span>';
    b.appendChild(document.createTextNode(s.short || s.title));
    b.addEventListener('click', function () { go(i); });
    stepsEl.appendChild(b);
  });

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function svg(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

  // Level 2: the code behind one arrow, read from the repo at build time.
  var sel = -1;

  function renderPeek(code) {
    var peek = el('div', 'peek');
    peek.addEventListener('click', function (e) { e.stopPropagation(); });
    var head = el('div', 'head');
    var path = el('div', 'path');
    var dir = code.path.slice(0, code.path.length - code.name.length);
    path.appendChild(document.createTextNode(dir));
    path.appendChild(el('b', null, code.name));
    path.appendChild(document.createTextNode(':' + code.lines[0].n + '-' + code.lines[code.lines.length - 1].n));
    if (code.ref && code.ref !== 'working') path.appendChild(el('span', 'ref', ' @ ' + code.ref));
    head.appendChild(path);
    var open = el('a', 'open', 'Open in VS Code ↗');
    open.href = code.open;
    head.appendChild(open);
    peek.appendChild(head);

    var focus = {};
    (code.focus || []).forEach(function (n) { focus[n] = 1; });
    var notes = code.notes || {};
    var body = el('div', 'code');
    code.lines.forEach(function (line) {
      var row = el('div', 'row' + (focus[line.n] ? ' focus' : ''));
      row.appendChild(el('span', 'ln', String(line.n)));
      row.appendChild(el('span', 'src', line.t || ' '));
      body.appendChild(row);
      if (notes[line.n]) {
        var anno = el('div', 'anno');
        anno.appendChild(el('span', null, notes[line.n]));
        body.appendChild(anno);
      }
    });
    peek.appendChild(body);
    return peek;
  }

  function select(k) {
    var msgs = steps[cur].messages || [];
    if (k >= 0 && !(msgs[k] && msgs[k].code)) return;
    sel = k === sel ? -1 : k;
    document.querySelectorAll('.peek').forEach(function (p) { p.remove(); });
    document.querySelectorAll('.note').forEach(function (n) { n.classList.toggle('sel', Number(n.dataset.k) === sel); });
    if (sel >= 0) {
      var li = document.querySelector('.note[data-k="' + sel + '"]');
      var peek = renderPeek(msgs[sel].code);
      li.appendChild(peek);
      li.scrollIntoView({ block: 'nearest' });
    }
    document.querySelector('.stage').classList.toggle('wide', sel >= 0);
    heat(sel);
    requestAnimationFrame(function () { drawWires(false); });
    try { history.replaceState(null, '', '#step=' + cur + (sel >= 0 ? '&code=' + (sel + 1) : '')); } catch (e) {}
  }

  function renderExplain(s, i) {
    var box = $('explain');
    box.innerHTML = '';
    box.appendChild(el('div', 'eyebrow', i === 0 ? 'Start here' : 'Step ' + i + ' of ' + (steps.length - 1)));
    box.appendChild(el('h2', null, s.title));
    if (s.summary) box.appendChild(el('p', 'summary', s.summary));
    var ol = el('ol', 'notes');
    var items = s.messages && s.messages.length ? s.messages : null;
    if (items) {
      items.forEach(function (m, k) {
        var li = el('li', 'note ' + (m.kind || 'main') + (m.code ? ' has-code' : ''));
        li.dataset.k = k;
        li.appendChild(el('span', 'num', String(k + 1)));
        var body = el('div');
        var what = el('div', 'what', m.label);
        if (m.code) what.appendChild(el('span', 'chip', '</> code'));
        body.appendChild(what);
        if (m.why) body.appendChild(el('div', 'why', m.why));
        if (m.file) body.appendChild(el('div', 'file', m.file));
        li.appendChild(body);
        li.addEventListener('mouseenter', function () { heat(k); });
        li.addEventListener('mouseleave', function () { heat(sel); });
        if (m.code) li.addEventListener('click', function () { select(k); });
        ol.appendChild(li);
      });
    } else {
      D.actors.forEach(function (a, k) {
        var li = el('li', 'note');
        li.appendChild(el('span', 'num', String(k + 1)));
        var body = el('div');
        body.appendChild(el('div', 'what', a.name));
        body.appendChild(el('div', 'why', a.explain || a.about || ''));
        if (a.file) body.appendChild(el('div', 'file', a.file));
        li.appendChild(body);
        ol.appendChild(li);
      });
    }
    box.appendChild(ol);
    if (s.oneliner) {
      var o = el('div', 'oneliner');
      o.appendChild(el('b', null, 'In one line: '));
      o.appendChild(document.createTextNode(s.oneliner));
      box.appendChild(o);
    }
    var lg = el('div', 'legend');
    lg.innerHTML = '<span><i></i>call / send</span><span><i class="r"></i>answer back</span><span><i class="a"></i>happens later, on its own</span>';
    box.appendChild(lg);
    var hasCode = (s.messages || []).some(function (m) { return m.code; });
    box.appendChild(el('div', 'keys', '← → to move between steps · hover a row to find its arrow' +
      (hasCode ? ' · click a </> row (or its arrow, or press its number) to see the code · Esc closes it' : '')));
  }

  function heat(k) {
    var groups = document.querySelectorAll('#wires .msg');
    groups.forEach(function (g) { g.classList.toggle('cold', k >= 0 && Number(g.dataset.k) !== k); });
    document.querySelectorAll('.note').forEach(function (n) { n.classList.toggle('hot', Number(n.dataset.k) === k); });
  }

  function drawWires(animate) {
    var board = $('board');
    var wires = $('wires');
    var W = board.clientWidth, H = board.clientHeight;
    wires.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    wires.setAttribute('width', W); wires.setAttribute('height', H);
    wires.innerHTML = '';
    var defs = svg('defs', {});
    var css = getComputedStyle(document.documentElement);
    [['main', css.getPropertyValue('--ink').trim()], ['return', css.getPropertyValue('--ink-3').trim()], ['async', css.getPropertyValue('--accent').trim()]].forEach(function (p) {
      var mk = svg('marker', { id: 'arr-' + p[0], viewBox: '0 0 10 10', refX: '8.5', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' });
      mk.appendChild(svg('path', { d: 'M0 0 L10 5 L0 10 z', fill: p[1] }));
      defs.appendChild(mk);
    });
    wires.appendChild(defs);

    var bRect = board.getBoundingClientRect();
    var xs = [], cardBottom = 0;
    D.actors.forEach(function (a) {
      var r = document.getElementById('actor-' + a.id).getBoundingClientRect();
      xs.push(r.left - bRect.left + r.width / 2);
      cardBottom = Math.max(cardBottom, r.bottom - bRect.top);
    });
    xs.forEach(function (x) { wires.appendChild(svg('line', { x1: x, y1: cardBottom + 6, x2: x, y2: H - 18, class: 'lifeline' })); });

    var s = steps[cur];
    var msgs = s.messages || [];
    var active = {};
    msgs.forEach(function (m) { active[m.from] = 1; active[m.to] = 1; });
    D.actors.forEach(function (a) {
      var c = document.getElementById('actor-' + a.id);
      c.classList.toggle('dim', msgs.length > 0 && !active[a.id]);
      c.classList.toggle('on', !!active[a.id]);
    });
    var old = document.querySelector('.empty-cast'); if (old) old.remove();
    if (!msgs.length) {
      var hint = el('div', 'empty-cast', s.boardHint || 'Press Next → to watch the first step.');
      board.appendChild(hint);
      return;
    }

    var top = cardBottom + 56, bottom = H - 36;
    var gap = Math.min(110, Math.max(58, (bottom - top) / Math.max(1, msgs.length - 1 || 1)));
    if (msgs.length === 1) gap = 0;
    var used = gap * (msgs.length - 1);
    var y0 = top + Math.max(0, ((bottom - top) - used) / 2.6);

    msgs.forEach(function (m, k) {
      var kind = m.kind || 'main';
      var x1 = xs[actorIndex[m.from]], x2 = xs[actorIndex[m.to]];
      var y = y0 + k * gap;
      var dir = x2 >= x1 ? 1 : -1;
      var g = svg('g', { class: 'msg' + (m.code ? ' has-code' : '') + (sel >= 0 && sel !== k ? ' cold' : ''), 'data-k': k });
      var start = x1 + dir * 8, end = x2 - dir * 10;
      var path = svg('path', { d: 'M' + start + ' ' + y + ' L' + end + ' ' + y, class: 'wire ' + kind, 'marker-end': 'url(#arr-' + kind + ')' });
      g.appendChild(path);
      var mid = (x1 + x2) / 2;
      var label = svg('text', { x: mid, y: y - 17, 'text-anchor': 'middle', class: 'wlabel ' + kind });
      label.textContent = m.label;
      g.appendChild(label);
      var badge = svg('g', { class: 'badge ' + kind, transform: 'translate(' + x1 + ' ' + y + ')' });
      badge.appendChild(svg('circle', { r: 11 }));
      var t = svg('text', { 'text-anchor': 'middle', dy: '4' }); t.textContent = String(k + 1);
      badge.appendChild(t);
      g.appendChild(badge);
      g.addEventListener('mouseenter', function () { heat(k); });
      g.addEventListener('mouseleave', function () { heat(sel); });
      if (m.code) g.addEventListener('click', function () { select(k); });
      wires.appendChild(g);

      if (animate && !reduce) {
        var len = Math.abs(end - start);
        var dash = kind === 'main' ? '' : path.style.strokeDasharray;
        g.style.opacity = '0';
        setTimeout(function () {
          g.style.transition = 'opacity .25s';
          g.style.opacity = '1';
          if (kind === 'main') {
            path.style.strokeDasharray = len + ' ' + len;
            path.style.strokeDashoffset = String(len);
            path.getBoundingClientRect();
            path.style.transition = 'stroke-dashoffset .5s ease-out';
            path.style.strokeDashoffset = '0';
          }
        }, 120 + k * 380);
      }
    });
  }

  function go(i, fromHash) {
    cur = Math.max(0, Math.min(steps.length - 1, i));
    sel = -1;
    document.querySelector('.stage').classList.remove('wide');
    stepsEl.querySelectorAll('.pill').forEach(function (p, k) { if (k === cur) p.setAttribute('aria-current', 'step'); else p.removeAttribute('aria-current'); });
    var active = stepsEl.children[cur]; if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    $('prev').disabled = cur === 0;
    $('next').textContent = cur === steps.length - 1 ? 'Start over ↺' : 'Next →';
    $('counter').textContent = cur + ' / ' + (steps.length - 1);
    renderExplain(steps[cur], cur);
    drawWires(true);
    if (!fromHash) { try { history.replaceState(null, '', '#step=' + cur); } catch (e) { location.hash = 'step=' + cur; } }
  }

  // Files dropdown: each step's files, in arrow order, consecutive repeats collapsed.
  var FILE_RE = /([\w.-]+\.(?:dart|kt|kts|swift|java|xml|gradle|ya?ml|json|plist|m|h))\b/;
  function fileOf(m) {
    if (m.code) return m.code.name;
    var x = FILE_RE.exec(m.file || '');
    return x ? x[1] : null;
  }
  var fileChain = [];
  steps.forEach(function (s, i) {
    var files = [];
    (s.messages || []).forEach(function (m, k) {
      var name = fileOf(m);
      if (!name) return;
      var last = files[files.length - 1];
      if (last && last.name === name) { if (!last.code && m.code) { last.k = k; last.code = true; } return; }
      files.push({ name: name, k: k, code: !!m.code });
    });
    if (files.length) fileChain.push({ i: i, label: s.short || s.title, files: files });
  });

  var pop = $('filesPop'), filesBtn = $('filesBtn');
  function renderFiles() {
    pop.innerHTML = '';
    pop.appendChild(el('h3', null, 'Files, in order'));
    pop.appendChild(el('p', 'hint', 'How the flow hops from file to file. Click one to jump to its step and code.'));
    fileChain.forEach(function (g) {
      var box = el('div', 'fgroup' + (g.i === cur ? ' cur' : ''));
      box.appendChild(el('div', 'fstep', 'Step ' + g.i + ' · ' + g.label));
      g.files.forEach(function (f, n) {
        if (n > 0) box.appendChild(el('div', 'fdown', '↓'));
        var b = el('button', 'ffile' + (f.code ? '' : ' no-code'), f.name);
        b.type = 'button';
        b.addEventListener('click', function () {
          closeFiles();
          go(g.i);
          if (f.code) select(f.k);
        });
        box.appendChild(b);
      });
      pop.appendChild(box);
    });
  }
  function openFiles() {
    renderFiles();
    var r = filesBtn.getBoundingClientRect();
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.left = Math.max(12, Math.min(r.right - 340, window.innerWidth - 352)) + 'px';
    pop.hidden = false;
    filesBtn.setAttribute('aria-expanded', 'true');
  }
  function closeFiles() { pop.hidden = true; filesBtn.setAttribute('aria-expanded', 'false'); }
  function toggleFiles() { if (pop.hidden) openFiles(); else closeFiles(); }
  if (!fileChain.length) filesBtn.hidden = true;
  filesBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleFiles(); });
  pop.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (!pop.hidden) closeFiles(); });

  $('prev').addEventListener('click', function () { go(cur - 1); });
  $('next').addEventListener('click', function () { go(cur === steps.length - 1 ? 0 : cur + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') { go(0); }
    else if (e.key === 'Escape' && !pop.hidden) { closeFiles(); }
    else if (e.key === 'Escape' && sel >= 0) { select(sel); }
    else if ((e.key === 'f' || e.key === 'F') && !filesBtn.hidden) { toggleFiles(); }
    else if (/^[1-9]$/.test(e.key)) { select(Number(e.key) - 1); }
  });
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { drawWires(false); }, 120); });
  var m = /step=(\d+)/.exec(location.hash);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawWires(false); });
  go(m ? Number(m[1]) : 0, true);
  var c = /code=(\d+)/.exec(location.hash);
  if (c) select(Number(c[1]) - 1);
  if (/files=1/.test(location.hash) && !filesBtn.hidden) openFiles();
})();
</script>
</body>
</html>
