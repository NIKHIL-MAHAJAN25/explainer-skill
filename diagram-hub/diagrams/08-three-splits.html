  * { box-sizing: border-box; }

  .glass { border: 1px solid rgba(255,255,255,0.55); background: rgba(255,255,255,0.38);
    backdrop-filter: blur(28px); -webkit-backdrop-filter: blur(28px);

  /* Stage */

  .tone-you .ic { background: var(--accent-soft); color: var(--accent); }

  svg.wires { position: absolute; inset: 0; z-index: 1; overflow: visible; }

  .wire.async { stroke: var(--accent); stroke-dasharray: 2 7; stroke-width: 3; }
  .wlabel { font-size: 15px; font-weight: 650; fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 6px; stroke-linejoin: round; }

  .badge circle { fill: var(--ink); } .badge text { fill: #fff; font-size: 12px; font-weight: 750; }
  .badge.return circle { fill: var(--ink-3); } .badge.async circle { fill: var(--accent); }
  .msg { transition: opacity .2s; }

  /* Explanation panel */
  .explain { border-radius: 22px; padding: 22px 22px 20px; display: flex; flex-direction: column; min-height: 0; overflow: auto; }
  .eyebrow { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-3); }
  .explain h2 { margin: 6px 0 8px; font-size: 26px; line-height: 32px; letter-spacing: -0.015em; font-weight: 780; }
  .explain .summary { margin: 0 0 16px; color: var(--ink-2); font-size: 15.5px; line-height: 24px; }

  .note { display: grid; grid-template-columns: 26px 1fr; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--card-soft); border: 1px solid var(--line); cursor: default; transition: border-color .15s, background .15s; }
  .note:hover, .note.hot { border-color: var(--line-strong); background: var(--surface); }
  .note .num { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 8px; background: var(--ink); color: #fff; font-size: 12px; font-weight: 750; margin-top: 1px; }

  .note .what { font-weight: 700; font-size: 15px; }

  .oneliner { margin-top: 14px; padding: 12px 14px; border-radius: 14px; background: var(--watch-soft); border: 1px solid var(--watch-line); color: var(--watch-ink); font-size: 14.5px; line-height: 21px; }
  .oneliner b { color: var(--watch-ink-strong); }

  .keys { font-size: 12px; color: var(--ink-4); margin-top: 8px; }

  /* Level 2: code peek */
  .stage.wide { grid-template-columns: minmax(0, 1fr) clamp(440px, 42vw, 640px); }
  .note.has-code { cursor: pointer; }
  .note .chip { display: inline-block; margin-left: 8px; padding: 0 7px; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font: 600 11px/18px "JetBrains Mono", ui-monospace, Consolas, monospace; vertical-align: 1px; }

  .peek .anno span::before { content: "↑ "; color: var(--watch); font-weight: 700; }

  .files-pop { position: fixed; z-index: 30; width: 340px; max-height: min(70vh, 640px); overflow: auto; padding: 14px 12px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line-strong); box-shadow: var(--shadow-lift); }
  .files-pop[hidden] { display: none; }
  .files-pop h3 { margin: 0 6px 4px; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); }
  .files-pop .hint { margin: 0 6px 10px; font-size: 12.5px; line-height: 18px; color: var(--ink-3); }
  .fgroup { padding: 8px 6px 6px; border-radius: 12px; }

  .fgroup.cur { background: var(--accent-soft); }

  .ffile { display: block; width: 100%; padding: 3px 8px; border: 0; border-radius: 8px; background: transparent; text-align: left; cursor: pointer; font: 500 13px/20px "JetBrains Mono", ui-monospace, Consolas, monospace; color: var(--ink); }
  .ffile:hover { background: var(--subtle); }
  .ffile.no-code { cursor: default; color: var(--ink-2); }
  .ffile.no-code:hover { background: transparent; }
  .fdown { padding-left: 16px; font-size: 12px; line-height: 13px; color: var(--ink-4); user-select: none; }
  #filesBtn[aria-expanded="true"] { border-color: var(--ink-3); }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

      <svg class="wires" id="wires" aria-hidden="true"></svg>
    </section>
    <aside class="explain glass" id="explain" aria-live="polite"></aside>
  </main>
</div>

erformanceService became abstract in services. Bonds plugs in Firebase, ultra plugs in Measure. Both apps really use the feature, just with different SDKs.","oneliner":"Both apps need the feature → two real plugs.","messages":[{"from":"caller","to":"socket","label":"PerformanceService","kind":"main","why":"A socket with four methods, one of which even returns a Dio piece (an interceptor). Each app builds it with its own SDK.","file":"performance_service.dart:11-24","code":{"path":"packages/services/lib/src/performance/performance_service.dart","from":11,"to":24,"focus":[11,23],"notes":{"11":"The socket.","23":"Bonds returns a Firebase interceptor, ultra a Measure one."},"ref":"89a6247a","name":"performance_service.dart","lines":[{"n":11,"t":"abstract class PerformanceService {"},{"n":12,"t":"  Future<void> startTrace(String name);"},{"n":13,"t":""},{"n":14,"t":"  Future<void> stopTrace(String name);"},{"n":15,"t":""},{"n":16,"t":"  /// Starts a screen-render trace tagged with [screenType] and returns a"},{"n":17,"t":"  /// function that stops it. Returns a no-op if performance monitoring is"},{"n":18,"t":"  /// unavailable."},{"n":19,"t":"  VoidCallback startScreenRenderTrace(String screenType);"},{"n":20,"t":""},{"n":21,"t":"  /// Returns a Dio interceptor that records performance data for every"},{"n":22,"t":"  /// network request."},{"n":23,"t":"  Interceptor createNetworkInterceptor();"},{"n":24,"t":"}"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/performance/performance_service.dart:11"}},{"from":"bonds","to":"sdk","label":"Firebase Crashlytics + Performance","kind":"main","why":"Their pubspec lines moved from services to bonds_services in the same commit."},{"from":"ultra","to":"sdk","label":"Measure","kind":"main","why":"measure_flutter and measure_dio live only in ultra_services' pubspec."}]},{"short":"2 · Adapter","title":"Split 2: a real plug and a null plug (done, 89a6247a)","summary":"A brand-new socket, HttpAdapterProvider. Bonds' plug builds Cronet/NSURLSession. Ultra doesn't want a native engine at all, so its plug returns null, meaning 'keep Dio's default'. The caller handles null.","oneliner":"Only one app needs the feature → design the socket so 'nothing' is a valid answer.","messages":[{"from":"caller","to":"socket","label":"createAdapter() → adapter or null","kind":"main","why":"The nullable return type is the design choice that keeps ultra's plug to one line and removes the isBondsApp check from services.","file":"http_adapter_provider.dart:7-17","code":{"path":"packages/services/lib/src/network/adapters/http_adapter_provider.dart","from":7,"to":17,"focus":[13,16],"notes":{"13":"Shared constant both sides use (plan B).","16":"Nullable: 'no special engine' is allowed."},"ref":"89a6247a","name":"http_adapter_provider.dart","lines":[{"n":7,"t":"abstract class HttpAdapterProvider {"},{"n":8,"t":"  /// Synthetic response header an adapter may add with the protocol its"},{"n":9,"t":"  /// native stack negotiated, e.g. `quic/1+spdy/3` or `h2`."},{"n":10,"t":"  ///"},{"n":11,"t":"  /// Read by `NetworkLogInterceptor`. Absent when the adapter doesn't report"},{"n":12,"t":"  /// it (iOS, dart:io)."},{"n":13,"t":"  static const negotiatedProtocolHeader = 'x-negotiated-protocol';"},{"n":14,"t":""},{"n":15,"t":"  /// The adapter Dio should use, or null to keep Dio's default (dart:io)."},{"n":16,"t":"  HttpClientAdapter? createAdapter();"},{"n":17,"t":"}"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/network/adapters/http_adapter_provider.dart:13"}},{"from":"ultra","to":"socket","label":"DefaultHttpAdapterProvider → null","kind":"main","why":"A plug that exists only to fill the socket. Without it, get_it has nothing registered and the first network call crashes.","file":"default_http_adapter_provider.dart:6-12","code":{"path":"packages/ultra_services/lib/src/network/default_http_adapter_provider.dart","from":5,"to":12,"focus":[6,11],"notes":{"6":"Same registration line as any real plug.","11":"The whole implementation."},"ref":"89a6247a","name":"default_http_adapter_provider.dart","lines":[{"n":5,"t":"/// Ultra keeps Dio's default dart:io engine."},{"n":6,"t":"@LazySingleton(as: HttpAdapterProvider)"},{"n":7,"t":"class DefaultHttpAdapterProvider implements HttpAdapterProvider {"},{"n":8,"t":"  const DefaultHttpAdapterProvider();"},{"n":9,"t":""},{"n":10,"t":"  @override"},{"n":11,"t":"  HttpClientAdapter? createAdapter() => null;"},{"n":12,"t":"}"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/ultra_services/lib/src/network/default_http_adapter_provider.dart:6"}},{"from":"bonds","to":"sdk","label":"native_dio_adapter","kind":"main","why":"The one pubspec line that moved. Ultra's dependency tree no longer has it (checked with pub deps)."}]},{"short":"3a · Events","title":"Split 3a (next): MoEngage events, a named slot","summary":"The socket already exists: EventLogger. But EventLoggerFactory asks for four of them, told apart by name. MoEngage's logger is registered in services today. Plan: move it to bonds_services, and give ultra a do-nothing logger under the same name.","oneliner":"Named slot → ultra must fill that exact name, or the app crashes at startup.","messages":[{"from":"caller","to":"socket","label":"@Named('MoEngageEventLogger')","kind":"main","why":"New term: named slot. When one socket type is plugged several times, @Named picks which one. Like Hilt's @Named qualifier. Each name is its own slot that must be filled.","file":"event_logger_factory.dart:5-17","code":{"path":"packages/services/lib/src/events/event_logger_factory.dart","from":5,"to":17,"focus":[9,15],"notes":{"9":"This slot is the one to fill differently per app.","15":"Same socket type as the other three: EventLogger."},"ref":"89a6247a","name":"event_logger_factory.dart","lines":[{"n":5,"t":"@injectable"},{"n":6,"t":"class EventLoggerFactory {"},{"n":7,"t":"  const EventLoggerFactory({"},{"n":8,"t":"    @Named('TapEventLogger') required this._tap,"},{"n":9,"t":"    @Named('MoEngageEventLogger') required this._moEngage,"},{"n":10,"t":"    @Named('MixpanelEventLogger') required this._mixpanel,"},{"n":11,"t":"    @Named('FirebaseAnalyticsEventLogger') required this._firebase,"},{"n":12,"t":"  });"},{"n":13,"t":""},{"n":14,"t":"  final EventLogger _tap;"},{"n":15,"t":"  final EventLogger _moEngage;"},{"n":16,"t":"  final EventLogger _mixpanel;"},{"n":17,"t":"  final EventLogger _firebase;"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/events/event_logger_factory.dart:9"}},{"from":"socket","to":"sdk","label":"today: MoEngageEventLogger in services","kind":"main","why":"Registered in the shared package, so moengage_flutter ships to ultra. This is the plug that moves to bonds_services.","file":"moengage.dart:1-11","code":{"path":"packages/services/lib/src/events/moengage/moengage.dart","from":1,"to":11,"focus":[3,6,7],"notes":{"3":"The SDK import that leaks into ultra.","6":"The slot's name.","7":"A factory plug for the EventLogger socket."},"ref":"89a6247a","name":"moengage.dart","lines":[{"n":1,"t":"import 'package:injectable/injectable.dart';"},{"n":2,"t":"import 'package:models/models.dart';"},{"n":3,"t":"import 'package:moengage_flutter/moengage_flutter.dart';"},{"n":4,"t":"import 'package:services/src/events/event_logger.dart';"},{"n":5,"t":""},{"n":6,"t":"@Named('MoEngageEventLogger')"},{"n":7,"t":"@Injectable(as: EventLogger)"},{"n":8,"t":"class MoEngageEventLogger implements EventLogger {"},{"n":9,"t":"  const MoEngageEventLogger(this.moEngage);"},{"n":10,"t":""},{"n":11,"t":"  final MoEngageFlutter moEngage;"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/events/moengage/moengage.dart:3"}},{"from":"ultra","to":"getit","label":"plan: no-op logger, same name","kind":"main","why":"Decision still open (handoff 2b): a do-nothing EventLogger in ultra_services named 'MoEngageEventLogger' (recommended), or make the factory's slot optional. CtaService is built eagerly and needs this factory, so a missing slot means a startup crash."}]},{"short":"3b · Inbox","title":"Split 3b (next): MoEngage inbox, a named slot + a lifetime fix","summary":"Same shape: NotificationInbox socket, @Named('MoengageInbox') slot. Two extra things: MoengageInbox is an eager @Singleton (must become @LazySingleton once it lives in bonds_services), and NotificationInboxService still checks isBondsApp.","oneliner":"When a plug moves to a per-app package, check its lifetime: eager plugs there crash on the module order.","messages":[{"from":"caller","to":"socket","label":"@Named('MoengageInbox') + isBondsApp","kind":"main","why":"Two inbox slots, plus an app check in shared code. Once each app plugs its own inbox, that check may not be needed any more (a later decision).","file":"notification_inbox_service.dart:6-21","code":{"path":"packages/services/lib/src/notifications/inbox/notification_inbox_service.dart","from":6,"to":21,"focus":[10,21],"notes":{"10":"The MoEngage inbox slot.","21":"Another 'which app am I?' in the shared package."},"ref":"89a6247a","name":"notification_inbox_service.dart","lines":[{"n":6,"t":"@injectable"},{"n":7,"t":"class NotificationInboxService {"},{"n":8,"t":"  NotificationInboxService({"},{"n":9,"t":"    @Named('TapInbox') required this._tapInbox,"},{"n":10,"t":"    @Named('MoengageInbox') required this._moengageInbox,"},{"n":11,"t":"    required this._notificationInboxStream,"},{"n":12,"t":"    required this._appConfig,"},{"n":13,"t":"  });"},{"n":14,"t":""},{"n":15,"t":"  final NotificationInbox _moengageInbox;"},{"n":16,"t":"  final NotificationInbox _tapInbox;"},{"n":17,"t":"  final NotificationInboxStream _notificationInboxStream;"},{"n":18,"t":"  final AppConfig _appConfig;"},{"n":19,"t":""},{"n":20,"t":"  /// BondScanner does not use Tap in-app notifications; only Moengage is used."},{"n":21,"t":"  bool get _useTapInbox => !_appConfig.isBondsApp;"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/notifications/inbox/notification_inbox_service.dart:10"}},{"from":"socket","to":"sdk","label":"today: eager @Singleton in services","kind":"main","why":"Eager = built during getIt.init(), as soon as it's registered. In services that works. In bonds_services, which registers first, its dependency (EnvironmentConfig) wouldn't exist yet → crash. So it moves as @LazySingleton.","file":"moengage_inbox.dart:12-15","code":{"path":"packages/services/lib/src/notifications/inbox/moengage/moengage_inbox.dart","from":5,"to":15,"focus":[5,13],"notes":{"5":"moengage_inbox SDK, shipped to ultra today.","13":"Eager. Must become @LazySingleton when it moves."},"ref":"89a6247a","name":"moengage_inbox.dart","lines":[{"n":5,"t":"import 'package:moengage_inbox/moengage_inbox.dart' as moengage;"},{"n":6,"t":"import 'package:services/src/configs/configs.dart';"},{"n":7,"t":"import 'package:services/src/notifications/inbox/notification_inbox.dart';"},{"n":8,"t":"import 'package:utils/utils.dart';"},{"n":9,"t":""},{"n":10,"t":"const String _tag = 'MoengageInbox';"},{"n":11,"t":""},{"n":12,"t":"@Named('MoengageInbox')"},{"n":13,"t":"@Singleton(as: NotificationInbox)"},{"n":14,"t":"class MoengageInbox extends NotificationInbox {"},{"n":15,"t":"  MoengageInbox({required this._environmentConfig});"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/notifications/inbox/moengage/moengage_inbox.dart:5"}},{"from":"ultra","to":"getit","label":"plan: empty inbox (or a new one)","kind":"main","why":"Decision still open (handoff 2c): an empty inbox under 'MoengageInbox', or a renamed/new inbox design (you lean 'new one')."}]},{"short":"Checklist","title":"The checklist for any split","summary":"1) Which SDK leaks into the other app? 2) Is there a socket already, or do I make one? Named? 3) Bonds' plug. 4) Ultra's plug: real, null, or no-op? 5) Lifetime: lazy in per-app packages. 6) Move the pubspec line. 7) Regenerate, then check the dependency tree.","oneliner":"Forget a plug → 'not registered' crash. Eager plug in a per-app package → startup crash. Forget the pubspec → the SDK still ships.","messages":[{"from":"getit","to":"caller","label":"missing plug → crash","kind":"return","why":"get_it throws 'Object/factory with type X is not registered' the moment anything asks. For eagerly built services that's during startup, so the app never opens."},{"from":"getit","to":"caller","label":"why per-app goes first","kind":"return","why":"The comment in both injector.dart files: services eagerly builds DeepLinkService, which needs CrashlyticsService, so the per-app module must already be registered. And that's exactly why everything in it must be lazy.","file":"ultra_app injector.dart:13-22","code":{"path":"apps/ultra_app/lib/di/injector.dart","from":13,"to":22,"focus":[14,19],"notes":{"14":"The reason for the order, written down.","19":"Per-app module first."},"ref":"89a6247a","name":"injector.dart","lines":[{"n":13,"t":"  externalPackageModulesBefore: ["},{"n":14,"t":"    // UltraServicesPackageModule must be registered before"},{"n":15,"t":"    // ServicesPackageModule: services eagerly builds DeepLinkService at"},{"n":16,"t":"    // init (preResolve: true), which needs CrashlyticsService via"},{"n":17,"t":"    // AttributionProvider. Its only implementation now lives here,"},{"n":18,"t":"    // not inside services itself, so this module has to register first."},{"n":19,"t":"    ExternalModule(UltraServicesPackageModule),"},{"n":20,"t":"    ExternalModule(ServicesPackageModule),"},{"n":21,"t":"    ExternalModule(CommonPackageModule),"},{"n":22,"t":"  ],"}],"open":"vscode://file/D:/Flutter/mobile_apps/apps/ultra_app/lib/di/injector.dart:14"}}]}]};

<script>
(function () {
  var D = window.EXPLAINER;
  document.documentElement.dataset.theme = D.theme || "linen";
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ICONS = {
    person: '<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    app: '<rect x="6" y="3" width="12" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    os: '<rect x="4" y="5" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 21h6M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    cloud: '<path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17 18H7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    server: '<rect x="4" y="4" width="16" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="16" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7.5h.01M8 16.5h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
    bell: '<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2Zm4 4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
    door: '<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    route: '<circle cx="6" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    key: '<circle cx="8" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="m11 12 8-8m-3 3 2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    inbox: '<path d="M4 13h4l2 3h4l2-3h4M5 5h14l1 8v6H4v-6l1-8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
  };

  document.title = D.title;
  $('title').textContent = D.title;
  $('subtitle').textContent = D.subtitle || '';

  var steps = D.steps;
  var cur = 0;
  var actorIndex = {};
  D.actors.forEach(function (a, i) { actorIndex[a.id] = i; });

  // Actor cards
  var actorsEl = $('actors');
  if (D.actors.length > 6) actorsEl.classList.add('many');
  actorsEl.style.gridTemplateColumns = 'repeat(' + D.actors.length + ', minmax(0, 1fr))';
  D.actors.forEach(function (a) {
    var card = document.createElement('div');
    card.className = 'actor tone-' + (a.tone || 'person');
    card.id = 'actor-' + a.id;
    card.innerHTML = '<div class="ic"><svg viewBox="0 0 24 24">' + (ICONS[a.icon] || ICONS.app) + '</svg></div>' +
      '<div class="name"></div><div class="about"></div>';
    card.querySelector('.name').textContent = a.name.replace(/([a-z])([A-Z])/g, '$1​$2');
    card.querySelector('.about').textContent = a.about || '';
    actorsEl.appendChild(card);
  });

  // Step pills
  var stepsEl = $('steps');
  steps.forEach(function (s, i) {
    var b = document.createElement('button');
    b.className = 'pill';
    b.innerHTML = '<span class="n">' + i + '</span>';
    b.appendChild(document.createTextNode(s.short || s.title));
    b.addEventListener('click', function () { go(i); });
    stepsEl.appendChild(b);
  });

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function svg(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

  // Level 2: the code behind one arrow, read from the repo at build time.
  var sel = -1;

  function renderPeek(code) {
    var peek = el('div', 'peek');
    peek.addEventListener('click', function (e) { e.stopPropagation(); });
    var head = el('div', 'head');
    var path = el('div', 'path');
    var dir = code.path.slice(0, code.path.length - code.name.length);
    path.appendChild(document.createTextNode(dir));
    path.appendChild(el('b', null, code.name));
    path.appendChild(document.createTextNode(':' + code.lines[0].n + '-' + code.lines[code.lines.length - 1].n));
    if (code.ref && code.ref !== 'working') path.appendChild(el('span', 'ref', ' @ ' + code.ref));
    head.appendChild(path);
    var open = el('a', 'open', 'Open in VS Code ↗');
    open.href = code.open;
    head.appendChild(open);
    peek.appendChild(head);

    var focus = {};
    (code.focus || []).forEach(function (n) { focus[n] = 1; });
    var notes = code.notes || {};
    var body = el('div', 'code');
    code.lines.forEach(function (line) {
      var row = el('div', 'row' + (focus[line.n] ? ' focus' : ''));
      row.appendChild(el('span', 'ln', String(line.n)));
      row.appendChild(el('span', 'src', line.t || ' '));
      body.appendChild(row);
      if (notes[line.n]) {
        var anno = el('div', 'anno');
        anno.appendChild(el('span', null, notes[line.n]));
        body.appendChild(anno);
      }
    });
    peek.appendChild(body);
    return peek;
  }

  function select(k) {
    var msgs = steps[cur].messages || [];
    if (k >= 0 && !(msgs[k] && msgs[k].code)) return;
    sel = k === sel ? -1 : k;
    document.querySelectorAll('.peek').forEach(function (p) { p.remove(); });
    document.querySelectorAll('.note').forEach(function (n) { n.classList.toggle('sel', Number(n.dataset.k) === sel); });
    if (sel >= 0) {
      var li = document.querySelector('.note[data-k="' + sel + '"]');
      var peek = renderPeek(msgs[sel].code);
      li.appendChild(peek);
      li.scrollIntoView({ block: 'nearest' });
    }
    document.querySelector('.stage').classList.toggle('wide', sel >= 0);
    heat(sel);
    requestAnimationFrame(function () { drawWires(false); });
    try { history.replaceState(null, '', '#step=' + cur + (sel >= 0 ? '&code=' + (sel + 1) : '')); } catch (e) {}
  }

  function renderExplain(s, i) {
    var box = $('explain');
    box.innerHTML = '';
    box.appendChild(el('div', 'eyebrow', i === 0 ? 'Start here' : 'Step ' + i + ' of ' + (steps.length - 1)));
    box.appendChild(el('h2', null, s.title));
    if (s.summary) box.appendChild(el('p', 'summary', s.summary));
    var ol = el('ol', 'notes');
    var items = s.messages && s.messages.length ? s.messages : null;
    if (items) {
      items.forEach(function (m, k) {
        var li = el('li', 'note ' + (m.kind || 'main') + (m.code ? ' has-code' : ''));
        li.dataset.k = k;
        li.appendChild(el('span', 'num', String(k + 1)));
        var body = el('div');
        var what = el('div', 'what', m.label);
        if (m.code) what.appendChild(el('span', 'chip', '</> code'));
        body.appendChild(what);
        if (m.why) body.appendChild(el('div', 'why', m.why));
        if (m.file) body.appendChild(el('div', 'file', m.file));
        li.appendChild(body);
        li.addEventListener('mouseenter', function () { heat(k); });
        li.addEventListener('mouseleave', function () { heat(sel); });
        if (m.code) li.addEventListener('click', function () { select(k); });
        ol.appendChild(li);
      });
    } else {
      D.actors.forEach(function (a, k) {
        var li = el('li', 'note');
        li.appendChild(el('span', 'num', String(k + 1)));
        var body = el('div');
        body.appendChild(el('div', 'what', a.name));
        body.appendChild(el('div', 'why', a.explain || a.about || ''));
        if (a.file) body.appendChild(el('div', 'file', a.file));
        li.appendChild(body);
        ol.appendChild(li);
      });
    }
    box.appendChild(ol);
    if (s.oneliner) {
      var o = el('div', 'oneliner');
      o.appendChild(el('b', null, 'In one line: '));
      o.appendChild(document.createTextNode(s.oneliner));
      box.appendChild(o);
    }
    var lg = el('div', 'legend');
    lg.innerHTML = '<span><i></i>call / send</span><span><i class="r"></i>answer back</span><span><i class="a"></i>happens later, on its own</span>';
    box.appendChild(lg);
    var hasCode = (s.messages || []).some(function (m) { return m.code; });
    box.appendChild(el('div', 'keys', '← → to move between steps · hover a row to find its arrow' +
      (hasCode ? ' · click a </> row (or its arrow, or press its number) to see the code · Esc closes it' : '')));
  }

  function heat(k) {
    var groups = document.querySelectorAll('#wires .msg');
    groups.forEach(function (g) { g.classList.toggle('cold', k >= 0 && Number(g.dataset.k) !== k); });
    document.querySelectorAll('.note').forEach(function (n) { n.classList.toggle('hot', Number(n.dataset.k) === k); });
  }

  function drawWires(animate) {
    var board = $('board');
    var wires = $('wires');
    var W = board.clientWidth, H = board.clientHeight;
    wires.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    wires.setAttribute('width', W); wires.setAttribute('height', H);
    wires.innerHTML = '';
    var defs = svg('defs', {});
    var css = getComputedStyle(document.documentElement);
    [['main', css.getPropertyValue('--ink').trim()], ['return', css.getPropertyValue('--ink-3').trim()], ['async', css.getPropertyValue('--accent').trim()]].forEach(function (p) {
      var mk = svg('marker', { id: 'arr-' + p[0], viewBox: '0 0 10 10', refX: '8.5', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' });
      mk.appendChild(svg('path', { d: 'M0 0 L10 5 L0 10 z', fill: p[1] }));
      defs.appendChild(mk);
    });
    wires.appendChild(defs);

    var bRect = board.getBoundingClientRect();
    var xs = [], cardBottom = 0;
    D.actors.forEach(function (a) {
      var r = document.getElementById('actor-' + a.id).getBoundingClientRect();
      xs.push(r.left - bRect.left + r.width / 2);
      cardBottom = Math.max(cardBottom, r.bottom - bRect.top);
    });
    xs.forEach(function (x) { wires.appendChild(svg('line', { x1: x, y1: cardBottom + 6, x2: x, y2: H - 18, class: 'lifeline' })); });

    var s = steps[cur];
    var msgs = s.messages || [];
    var active = {};
    msgs.forEach(function (m) { active[m.from] = 1; active[m.to] = 1; });
    D.actors.forEach(function (a) {
      var c = document.getElementById('actor-' + a.id);
      c.classList.toggle('dim', msgs.length > 0 && !active[a.id]);
      c.classList.toggle('on', !!active[a.id]);
    });
    var old = document.querySelector('.empty-cast'); if (old) old.remove();
    if (!msgs.length) {
      var hint = el('div', 'empty-cast', s.boardHint || 'Press Next → to watch the first step.');
      board.appendChild(hint);
      return;
    }

    var top = cardBottom + 56, bottom = H - 36;
    var gap = Math.min(110, Math.max(58, (bottom - top) / Math.max(1, msgs.length - 1 || 1)));
    if (msgs.length === 1) gap = 0;
    var used = gap * (msgs.length - 1);
    var y0 = top + Math.max(0, ((bottom - top) - used) / 2.6);

    msgs.forEach(function (m, k) {
      var kind = m.kind || 'main';
      var x1 = xs[actorIndex[m.from]], x2 = xs[actorIndex[m.to]];
      var y = y0 + k * gap;
      var dir = x2 >= x1 ? 1 : -1;
      var g = svg('g', { class: 'msg' + (m.code ? ' has-code' : '') + (sel >= 0 && sel !== k ? ' cold' : ''), 'data-k': k });
      var start = x1 + dir * 8, end = x2 - dir * 10;
      var path = svg('path', { d: 'M' + start + ' ' + y + ' L' + end + ' ' + y, class: 'wire ' + kind, 'marker-end': 'url(#arr-' + kind + ')' });
      g.appendChild(path);
      var mid = (x1 + x2) / 2;
      var label = svg('text', { x: mid, y: y - 17, 'text-anchor': 'middle', class: 'wlabel ' + kind });
      label.textContent = m.label;
      g.appendChild(label);
      var badge = svg('g', { class: 'badge ' + kind, transform: 'translate(' + x1 + ' ' + y + ')' });
      badge.appendChild(svg('circle', { r: 11 }));
      var t = svg('text', { 'text-anchor': 'middle', dy: '4' }); t.textContent = String(k + 1);
      badge.appendChild(t);
      g.appendChild(badge);
      g.addEventListener('mouseenter', function () { heat(k); });
      g.addEventListener('mouseleave', function () { heat(sel); });
      if (m.code) g.addEventListener('click', function () { select(k); });
      wires.appendChild(g);

      if (animate && !reduce) {
        var len = Math.abs(end - start);
        var dash = kind === 'main' ? '' : path.style.strokeDasharray;
        g.style.opacity = '0';
        setTimeout(function () {
          g.style.transition = 'opacity .25s';
          g.style.opacity = '1';
          if (kind === 'main') {
            path.style.strokeDasharray = len + ' ' + len;
            path.style.strokeDashoffset = String(len);
            path.getBoundingClientRect();
            path.style.transition = 'stroke-dashoffset .5s ease-out';
            path.style.strokeDashoffset = '0';
          }
        }, 120 + k * 380);
      }
    });
  }

  function go(i, fromHash) {
    cur = Math.max(0, Math.min(steps.length - 1, i));
    sel = -1;
    document.querySelector('.stage').classList.remove('wide');
    stepsEl.querySelectorAll('.pill').forEach(function (p, k) { if (k === cur) p.setAttribute('aria-current', 'step'); else p.removeAttribute('aria-current'); });
    var active = stepsEl.children[cur]; if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    $('prev').disabled = cur === 0;
    $('next').textContent = cur === steps.length - 1 ? 'Start over ↺' : 'Next →';
    $('counter').textContent = cur + ' / ' + (steps.length - 1);
    renderExplain(steps[cur], cur);
    drawWires(true);
    if (!fromHash) { try { history.replaceState(null, '', '#step=' + cur); } catch (e) { location.hash = 'step=' + cur; } }
  }

  // Files dropdown: each step's files, in arrow order, consecutive repeats collapsed.
  var FILE_RE = /([\w.-]+\.(?:dart|kt|kts|swift|java|xml|gradle|ya?ml|json|plist|m|h))\b/;
  function fileOf(m) {
    if (m.code) return m.code.name;
    var x = FILE_RE.exec(m.file || '');
    return x ? x[1] : null;
  }
  var fileChain = [];
  steps.forEach(function (s, i) {
    var files = [];
    (s.messages || []).forEach(function (m, k) {
      var name = fileOf(m);
      if (!name) return;
      var last = files[files.length - 1];
      if (last && last.name === name) { if (!last.code && m.code) { last.k = k; last.code = true; } return; }
      files.push({ name: name, k: k, code: !!m.code });
    });
    if (files.length) fileChain.push({ i: i, label: s.short || s.title, files: files });
  });

  var pop = $('filesPop'), filesBtn = $('filesBtn');
  function renderFiles() {
    pop.innerHTML = '';
    pop.appendChild(el('h3', null, 'Files, in order'));
    pop.appendChild(el('p', 'hint', 'How the flow hops from file to file. Click one to jump to its step and code.'));
    fileChain.forEach(function (g) {
      var box = el('div', 'fgroup' + (g.i === cur ? ' cur' : ''));
      box.appendChild(el('div', 'fstep', 'Step ' + g.i + ' · ' + g.label));
      g.files.forEach(function (f, n) {
        if (n > 0) box.appendChild(el('div', 'fdown', '↓'));
        var b = el('button', 'ffile' + (f.code ? '' : ' no-code'), f.name);
        b.type = 'button';
        b.addEventListener('click', function () {
          closeFiles();
          go(g.i);
          if (f.code) select(f.k);
        });
        box.appendChild(b);
      });
      pop.appendChild(box);
    });
  }
  function openFiles() {
    renderFiles();
    var r = filesBtn.getBoundingClientRect();
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.left = Math.max(12, Math.min(r.right - 340, window.innerWidth - 352)) + 'px';
    pop.hidden = false;
    filesBtn.setAttribute('aria-expanded', 'true');
  }
  function closeFiles() { pop.hidden = true; filesBtn.setAttribute('aria-expanded', 'false'); }
  function toggleFiles() { if (pop.hidden) openFiles(); else closeFiles(); }
  if (!fileChain.length) filesBtn.hidden = true;
  filesBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleFiles(); });
  pop.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (!pop.hidden) closeFiles(); });

  $('prev').addEventListener('click', function () { go(cur - 1); });
  $('next').addEventListener('click', function () { go(cur === steps.length - 1 ? 0 : cur + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') { go(0); }
    else if (e.key === 'Escape' && !pop.hidden) { closeFiles(); }
    else if (e.key === 'Escape' && sel >= 0) { select(sel); }
    else if ((e.key === 'f' || e.key === 'F') && !filesBtn.hidden) { toggleFiles(); }
    else if (/^[1-9]$/.test(e.key)) { select(Number(e.key) - 1); }
  });
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { drawWires(false); }, 120); });
  var m = /step=(\d+)/.exec(location.hash);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawWires(false); });
  go(m ? Number(m[1]) : 0, true);
  var c = /code=(\d+)/.exec(location.hash);
  if (c) select(Number(c[1]) - 1);
  if (/files=1/.test(location.hash) && !filesBtn.hidden) openFiles();
})();
</script>
</body>
</html>
