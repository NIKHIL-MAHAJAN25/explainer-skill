nects them at startup, and each app only ever sees its own plugs.","oneliner":"Socket in services, plug in the app's package, get_it as the wire.","boardHint":"Press Next → to see the problem this solves."},{"short":"Problem","title":"The problem: what's in services ships in both apps","summary":"Before the Measure work, CrashlyticsService was a real Firebase class inside services, and firebase_crashlytics was in services' pubspec. Both apps depend on services, so both apps shipped Firebase Crashlytics, even ultra, which wanted Measure instead.","oneliner":"A dependency of a dependency still ends up in your APK.","messages":[{"from":"app","to":"socket","label":"depends on services","kind":"main","why":"New term: transitive dependency. Ultra never asked for Firebase Crashlytics, but it asked for services, and services asked for Firebase. So it arrives anyway. In Gradle terms: services exposed it like an api(…) dependency.","file":"services/pubspec.yaml:30, 32 (before cb7038e3)","code":{"path":"packages/services/pubspec.yaml","ref":"cb7038e3^","from":28,"to":33,"focus":[30,32],"notes":{"30":"Firebase Crashlytics, in the shared package.","32":"Firebase Performance, same problem."},"name":"pubspec.yaml","lines":[{"n":28,"t":"  firebase_analytics: 12.0.0"},{"n":29,"t":"  firebase_core: 4.0.0"},{"n":30,"t":"  firebase_crashlytics: 5.0.0"},{"n":31,"t":"  firebase_messaging: 16.0.0"},{"n":32,"t":"  firebase_performance: 0.11.0"},{"n":33,"t":"  firebase_remote_config: 6.0.0"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/pubspec.yaml:30"}},{"from":"caller","to":"socket","label":"uses concrete Firebase class","kind":"main","why":"The class itself imported Firebase. Anyone using CrashlyticsService was tied to Firebase, with no way for ultra to swap it.","file":"crashlytics_service.dart:1-15 (before cb7038e3)","code":{"path":"packages/services/lib/src/crash/crashlytics/crashlytics_service.dart","ref":"cb7038e3^","from":1,"to":15,"focus":[3,10],"notes":{"3":"Th },{"n":3,"t":"    required Object error,"},{"n":4,"t":"    String? reason,"},{"n":5,"t":"    StackTrace? stackTrace,"},{"n":6,"t":"  });"},{"n":7,"t":"}"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/services/lib/src/crash/crashlytics/crashlytics_service.dart:1"}}]},{"short":"Plugs","title":"The plugs: one implementation per app","summary":"Each app's own package implements the socket with its own SDK. Bonds' plug uses Firebase Crashlytics; ultra's uses Measure. The SDK line moves into that package's pubspec, so only that app gets it.","oneliner":"Same socket shape, different wiring inside. The SDK travels with the plug.","messages":[{"from":"bonds","to":"socket","label":"FirebaseCrashlyticsService implements","kind":"main","why":"New term: implements. 'I promise to provide every method the abstract class lists', like `class X : MyInterface` in Kotlin. The compiler checks the promise.","file":"firebase_crashlytics_service.dart:9-17","code":{"path":"packages/bonds_services/lib/src/crash/firebase_crashlytics_service.dart","from":9,"to":17,"focus":[9,10],"notes":{"9":"'Register me as the CrashlyticsService' (next step).","10":"Fills the socket's contract with Firebase code."},"ref":"89a6247a","name":"firebase_crashlytics_service.dart","lines":[{"n":9,"t":"@LazySingleton(as: CrashlyticsService)"},{"n":10,"t":"class FirebaseCrashlyticsService implements CrashlyticsService {"},{"n":11,"t":"  const FirebaseCrashlyticsService({"},{"n":12,"t":"    required this._diagnosticLogger,"},{"n":13,"t":"    required this._preferenceService,"},{"n":14,"t":"  });"},{"n":15,"t":""},{"n":16,"t":"  final DiagnosticLogger _diagnosticLogger;"},{"n":17,"t":"  final PreferenceService _preferenceService;"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/bonds_services/lib/src/crash/firebase_crashlytics_service.dart:9"}},{"from":"ultra","to":"socket","label":"MeasureCrashlyticsService implements","kind":"main","why":"Same socket, completely different SDK inside. services can't tell the difference, and doesn't need to.","file":"measure_crashlytics_service.dart:10-18","code":{"path":"packages/ultra_services/lib/src/crash/measure_crashlytics_service.dart","from":10,"to":18,"focus":[10,11],"notes":{"10":"Same registration, same socket type.","11":"Measure inside instead of Firebase."},"ref":"89a6247a","name":"measure_crashlytics_service.dart","lines":[{"n":10,"t":"@LazySingleton(as: CrashlyticsService)"},{"n":11,"t":"class MeasureCrashlyticsService implements CrashlyticsService {"},{"n":12,"t":"  const MeasureCrashlyticsService({"},{"n":13,"t":"    required this._diagnosticLogger,"},{"n":14,"t":"    required this._preferenceService,"},{"n":15,"t":"  });"},{"n":16,"t":""},{"n":17,"t":"  final DiagnosticLogger _diagnosticLogger;"},{"n":18,"t":"  final PreferenceService _preferenceService;"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/ultra_services/lib/src/crash/measure_crashlytics_service.dart:10"}},{"from":"ultra","to":"ultra","label":"SDK lives in this pubspec","kind":"main","why":"measure_flutter is listed here, not in services. Only apps that depend on ultra_services (i.e. ultra) get it. Bonds' pubspec has firebase_crashlytics the same way.","file":"ultra_services/pubspec.yaml:18-19","code":{"path":"packages/ultra_services/pubspec.yaml","from":11,"to":19,"focus":[14,18],"notes":{"14":"Depends on services, to see the socket.","18":"The SDK, now only in ultra's tree."},"ref":"89a6247a","name":"pubspec.yaml","lines":[{"n":11,"t":"dependencies:"},{"n":12,"t":"  flutter:"},{"n":13,"t":"    sdk: flutter"},{"n":14,"t":"  services: any"},{"n":15,"t":"  utils: any"},{"n":16,"t":"  injectable: 3.0.0"},{"n":17,"t":"  get_it: 9.2.0"},{"n":18,"t":"  measure_flutter: 0.7.0"},{"n":19,"t":"  measure_dio: 0.7.0"}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/ultra_services/pubspec.yaml:14"}}]},{"short":"Register","title":"Registration: the annotation writes the wiring","summary":"@LazySingleton(as: CrashlyticsService) is an instruction to the code generator (injectable). When you run melos generate, it writes a module file that tells get_it: 'when someone asks for CrashlyticsService, build a FirebaseCrashlyticsService'.","oneliner":"You write the annotation; build_runner writes the registration; get_it stores it.","messages":[{"from":"bonds","to":"getit","label":"lazySingleton<CrashlyticsService>","kind":"main","why":"New term: lazy singleton. Built once, on first use, then reused. Like Hilt's @Singleton + Lazy<T>. The generated file is gitignored, so this peek shows the one on your disk.","file":"bonds_services_injector.module.dart:21-34 (generated)","code":{"path":"packages/bonds_services/lib/di/bonds_services_injector.module.dart","ref":"working","from":20,"to":35,"focus":[23,25,28],"notes":{"23":"The socket type is the key…","25":"…and the plug is the value. gh<…>() inside the lambda runs later, on first use.","28":"The native adapter split uses exactly the same shape."},"name":"bonds_services_injector.module.dart","lines":[{"n":20,"t":"import 'package:moengage_flutter/moengage_flutter.dart' as _i182;"},{"n":21,"t":"import 'package:services/services.dart' as _i473;"},{"n":22,"t":""},{"n":23,"t":"class BondsServicesPackageModule extends _i526.MicroPackageModule {"},{"n":24,"t":"// initializes the registration of main-scope dependencies inside of GetIt"},{"n":25,"t":"  @override"},{"n":26,"t":"  _i687.FutureOr<void> init(_i526.GetItHelper gh) {"},{"n":27,"t":"    final moEngageModule = _$MoEngageModule();"},{"n":28,"t":"    gh.lazySingleton<_i182.MoEngageFlutter>(() => moEngageModule.moEngage());"},{"n":29,"t":"    gh.lazySingleton<_i473.NotificationInbox>("},{"n":30,"t":"      () =>"},{"n":31,"t":"          _i378.MoengageInbox(environmentConfig: gh<_i473.EnvironmentConfig>())"},{"n":32,"t":"            ..init(),"},{"n":33,"t":"      instanceName: 'MoengageInbox',"},{"n":34,"t":"    );"},{"n":35,"t":"    gh.lazySingleton<_i473.PerformanceService>("}],"open":"vscode://file/D:/Flutter/mobile_apps/packages/bonds_services/lib/di/bonds_services_injector.module.dart:23"}}]},{"short":"Startup","title":"Startup: each app plugs in only its own package","summary":"Each app's injector.dart lists the modules to register, in order: its own per-app package first, then services, then common. Ultra's lists UltraServicesPackageModule; it has no way to even see bonds_services.","oneliner":"The app chooses the plugs simply by which package it lists.","messages":[{"from":"app","to":"injector","label":"configureInjection()","kind":"main","why":"Called once in main() before the app runs. Like setting up a Hilt component before any Activity starts.","file":"ultra_app injector.dart:11-26","code":{"path":"apps/ultra_app/lib/di/injector.dart","from":11,"to":26,"focus":[19,20,26],"notes":{"19":"Ultra's plugs register first…","20":"…then the shared package…","26":"…and getIt.init() runs all the registrations."},"ref":"89a6247a","name":"injector.dart","lines":[{"n":11,"t":"@InjectableInit("},{"n":12,"t":"  ignoreUnregisteredTypesInPackages: ['common'],"},{"n":13,"t":"  externalPackageModulesBefore: ["},{"n":14,"t":"    // UltraServicesPackageModule must be registered before"},{"n":15,"t":"    // ServicesPackageModule: services eagerly builds DeepLinkService at"},{"n":16,"t":"    // init (preResolve: true), which needs CrashlyticsService via"},{"n":17,"t":"    // AttributionProvider. Its only implementation now lives here,"},{"n":18,"t":"    // not inside services itself, so this module has to register first."},{"n":19,"t":"    ExternalModule(UltraServicesPackageModule),"},{"n":20,"t":"    ExternalModule(ServicesPackageModule),"},{"n":21,"t":"    ExternalModule(CommonPackageModule),"},{"n":22,"t":"  ],"},{"n":23,"t":")"},{"n":24,"t":"Future<void> configureInjection() async {"},{"n":25,"t":"  AppScreenType.registerScreens();"},{"n":26,"t":"  await getIt.init();"}],"open":"vscode://file/D:/Flutter/mobile_apps/apps/ultra_app/lib/di/injector.dart:19"}},{"from":"injector","to":"getit","label":"register ultra plugs, then services","kind":"main","why":"Why the plugs must be lazy: they register BEFORE services, so things they need (PreferenceService, DiagnosticLogger) don't exist yet. A lazy plug is only built later, when first asked for, by which point everything is registered."}]},{"short":"Use","title":"Shared code asks for the socket, gets the app's plug","summary":"Code in services only ever names the socket type. get_it hands it whichever plug the running app registered. In bonds that's Firebase; in ultra it's Measure. Same line of shared code, different behaviour per app.","oneliner":"Shared code depends on the socket. Each app decides the plug. That's the whole trick.","messages":[{"from":"caller","to":"getit","label":"give me a CrashlyticsService","kind":"main","why":"New term: dependency inversion. The shared code depends on an abstraction (the socket), and the concrete choice is made outside, by the app. Usually via a constructor parameter that injectable fills in."},{"from":"getit","to":"caller","label":"this app's plug","kind":"return","why":"Ultra resolves it explicitly at startup, too, so its error handlers are installed even if nothing else asks first.","file":"ultra_app injector.dart:28-36","code":{"path":"apps/ultra_app/lib/di/injector.dart","from":28,"to":37,"focus":[36],"notes":{"36":"Ask by socket type. Ultra gets Measure here; bonds' same line gets Firebase."},"ref":"89a6247a","name":"injector.dart","lines":[{"n":28,"t":"  // Resolve CrashlyticsService explicitly so its @postConstruct wraps Measure's"},{"n":29,"t":"  // global error handlers with diagnostic logging. It must be a lazy singleton"},{"n":30,"t":"  // because UltraServicesPackageModule registers before"},{"n":31,"t":"  // PreferenceService/DiagnosticLogger exist, so nothing builds it at"},{"n":32,"t":"  // registration time. Without this line, it would only be built because"},{"n":33,"t":"  // DeepLinkService -> AttributionProvider happens to depend on it; if that"},{"n" <script>
(function () {
  var D = window.EXPLAINER;
  document.documentElement.dataset.theme = D.theme || "linen";
  var $ = function (id) { return document.getElementById(id); };
  var NS = 'http://www.w3.org/2000/svg';
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var ICONS = {
    person: '<path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm-7 8a7 7 0 0 1 14 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    app: '<rect x="6" y="3" width="12" height="18" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M10 17h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    os: '<rect x="4" y="5" width="16" height="12" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M9 21h6M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    cloud: '<path d="M7 18a4 4 0 0 1-.5-8 5.5 5.5 0 0 1 10.6 1.5A3.3 3.3 0 0 1 17 18H7Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>',
    server: '<rect x="4" y="4" width="16" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="16" height="7" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8 7.5h.01M8 16.5h.01" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/>',
    bell: '<path d="M6 16V11a6 6 0 1 1 12 0v5l2 2H4l2-2Zm4 4h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>',
    door: '<path d="M6 21V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v17M4 21h16M14 12h.01" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    route: '<circle cx="6" cy="18" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="18" cy="6" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M8.5 18H15a3 3 0 0 0 0-6H9a3 3 0 0 1 0-6h6.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    key: '<circle cx="8" cy="15" r="4" fill="none" stroke="currentColor" stroke-width="2"/><path d="m11 12 8-8m-3 3 2 2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>',
    inbox: '<path d="M4 13h4l2 3h4l2-3h4M5 5h14l1 8v6H4v-6l1-8Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>'
  };

  document.title = D.title;
  $('title').textContent = D.title;
  $('subtitle').textContent = D.subtitle || '';

  var steps = D.steps;
  var cur = 0;
  var actorIndex = {};
  D.actors.forEach(function (a, i) { actorIndex[a.id] = i; });

  // Actor cards
  var actorsEl = $('actors');
  if (D.actors.length > 6) actorsEl.classList.add('many');
  actorsEl.style.gridTemplateColumns = 'repeat(' + D.actors.length + ', minmax(0, 1fr))';
  D.actors.forEach(function (a) {
    var card = document.createElement('div');
    card.className = 'actor tone-' + (a.tone || 'person');
    card.id = 'actor-' + a.id;
    card.innerHTML = '<div class="ic"><svg viewBox="0 0 24 24">' + (ICONS[a.icon] || ICONS.app) + '</svg></div>' +
      '<div class="name"></div><div class="about"></div>';
    card.querySelector('.name').textContent = a.name.replace(/([a-z])([A-Z])/g, '$1​$2');
    card.querySelector('.about').textContent = a.about || '';
    actorsEl.appendChild(card);
  });

  // Step pills
  var stepsEl = $('steps');
  steps.forEach(function (s, i) {
    var b = document.createElement('button');
    b.className = 'pill';
    b.innerHTML = '<span class="n">' + i + '</span>';
    b.appendChild(document.createTextNode(s.short || s.title));
    b.addEventListener('click', function () { go(i); });
    stepsEl.appendChild(b);
  });

  function el(tag, cls, text) { var e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }
  function svg(tag, attrs) { var e = document.createElementNS(NS, tag); for (var k in attrs) e.setAttribute(k, attrs[k]); return e; }

  // Level 2: the code behind one arrow, read from the repo at build time.
  var sel = -1;

  function renderPeek(code) {
    var peek = el('div', 'peek');
    peek.addEventListener('click', function (e) { e.stopPropagation(); });
    var head = el('div', 'head');
    var path = el('div', 'path');
    var dir = code.path.slice(0, code.path.length - code.name.length);
    path.appendChild(document.createTextNode(dir));
    path.appendChild(el('b', null, code.name));
    path.appendChild(document.createTextNode(':' + code.lines[0].n + '-' + code.lines[code.lines.length - 1].n));
    if (code.ref && code.ref !== 'working') path.appendChild(el('span', 'ref', ' @ ' + code.ref));
    head.appendChild(path);
    var open = el('a', 'open', 'Open in VS Code ↗');
    open.href = code.open;
    head.appendChild(open);
    peek.appendChild(head);

    var focus = {};
    (code.focus || []).forEach(function (n) { focus[n] = 1; });
    var notes = code.notes || {};
    var body = el('div', 'code');
    code.lines.forEach(function (line) {
      var row = el('div', 'row' + (focus[line.n] ? ' focus' : ''));
      row.appendChild(el('span', 'ln', String(line.n)));
      row.appendChild(el('span', 'src', line.t || ' '));
      body.appendChild(row);
      if (notes[line.n]) {
        var anno = el('div', 'anno');
        anno.appendChild(el('span', null, notes[line.n]));
        body.appendChild(anno);
      }
    });
    peek.appendChild(body);
    return peek;
  }

  function select(k) {
    var msgs = steps[cur].messages || [];
    if (k >= 0 && !(msgs[k] && msgs[k].code)) return;
    sel = k === sel ? -1 : k;
    document.querySelectorAll('.peek').forEach(function (p) { p.remove(); });
    document.querySelectorAll('.note').forEach(function (n) { n.classList.toggle('sel', Number(n.dataset.k) === sel); });
    if (sel >= 0) {
      var li = document.querySelector('.note[data-k="' + sel + '"]');
      var peek = renderPeek(msgs[sel].code);
      li.appendChild(peek);
      li.scrollIntoView({ block: 'nearest' });
    }
    document.querySelector('.stage').classList.toggle('wide', sel >= 0);
    heat(sel);
    requestAnimationFrame(function () { drawWires(false); });
    try { history.replaceState(null, '', '#step=' + cur + (sel >= 0 ? '&code=' + (sel + 1) : '')); } catch (e) {}
  }

  function renderExplain(s, i) {
    var box = $('explain');
    box.innerHTML = '';
    box.appendChild(el('div', 'eyebrow', i === 0 ? 'Start here' : 'Step ' + i + ' of ' + (steps.length - 1)));
    box.appendChild(el('h2', null, s.title));
    if (s.summary) box.appendChild(el('p', 'summary', s.summary));
    var ol = el('ol', 'notes');
    var items = s.messages && s.messages.length ? s.messages : null;
    if (items) {
      items.forEach(function (m, k) {
        var li = el('li', 'note ' + (m.kind || 'main') + (m.code ? ' has-code' : ''));
        li.dataset.k = k;
        li.appendChild(el('span', 'num', String(k + 1)));
        var body = el('div');
        var what = el('div', 'what', m.label);
        if (m.code) what.appendChild(el('span', 'chip', '</> code'));
        body.appendChild(what);
        if (m.why) body.appendChild(el('div', 'why', m.why));
        if (m.file) body.appendChild(el('div', 'file', m.file));
        li.appendChild(body);
        li.addEventListener('mouseenter', function () { heat(k); });
        li.addEventListener('mouseleave', function () { heat(sel); });
        if (m.code) li.addEventListener('click', function () { select(k); });
        ol.appendChild(li);
      });
    } else {
      D.actors.forEach(function (a, k) {
        var li = el('li', 'note');
        li.appendChild(el('span', 'num', String(k + 1)));
        var body = el('div');
        body.appendChild(el('div', 'what', a.name));
        body.appendChild(el('div', 'why', a.explain || a.about || ''));
        if (a.file) body.appendChild(el('div', 'file', a.file));
        li.appendChild(body);
        ol.appendChild(li);
      });
    }
    box.appendChild(ol);
    if (s.oneliner) {
      var o = el('div', 'oneliner');
      o.appendChild(el('b', null, 'In one line: '));
      o.appendChild(document.createTextNode(s.oneliner));
      box.appendChild(o);
    }
    var lg = el('div', 'legend');
    lg.innerHTML = '<span><i></i>call / send</span><span><i class="r"></i>answer back</span><span><i class="a"></i>happens later, on its own</span>';
    box.appendChild(lg);
    var hasCode = (s.messages || []).some(function (m) { return m.code; });
    box.appendChild(el('div', 'keys', '← → to move between steps · hover a row to find its arrow' +
      (hasCode ? ' · click a </> row (or its arrow, or press its number) to see the code · Esc closes it' : '')));
  }

  function heat(k) {
    var groups = document.querySelectorAll('#wires .msg');
    groups.forEach(function (g) { g.classList.toggle('cold', k >= 0 && Number(g.dataset.k) !== k); });
    document.querySelectorAll('.note').forEach(function (n) { n.classList.toggle('hot', Number(n.dataset.k) === k); });
  }

  function drawWires(animate) {
    var board = $('board');
    var wires = $('wires');
    var W = board.clientWidth, H = board.clientHeight;
    wires.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    wires.setAttribute('width', W); wires.setAttribute('height', H);
    wires.innerHTML = '';
    var defs = svg('defs', {});
    var css = getComputedStyle(document.documentElement);
    [['main', css.getPropertyValue('--ink').trim()], ['return', css.getPropertyValue('--ink-3').trim()], ['async', css.getPropertyValue('--accent').trim()]].forEach(function (p) {
      var mk = svg('marker', { id: 'arr-' + p[0], viewBox: '0 0 10 10', refX: '8.5', refY: '5', markerWidth: '7', markerHeight: '7', orient: 'auto-start-reverse' });
      mk.appendChild(svg('path', { d: 'M0 0 L10 5 L0 10 z', fill: p[1] }));
      defs.appendChild(mk);
    });
    wires.appendChild(defs);

    var bRect = board.getBoundingClientRect();
    var xs = [], cardBottom = 0;
    D.actors.forEach(function (a) {
      var r = document.getElementById('actor-' + a.id).getBoundingClientRect();
      xs.push(r.left - bRect.left + r.width / 2);
      cardBottom = Math.max(cardBottom, r.bottom - bRect.top);
    });
    xs.forEach(function (x) { wires.appendChild(svg('line', { x1: x, y1: cardBottom + 6, x2: x, y2: H - 18, class: 'lifeline' })); });

    var s = steps[cur];
    var msgs = s.messages || [];
    var active = {};
    msgs.forEach(function (m) { active[m.from] = 1; active[m.to] = 1; });
    D.actors.forEach(function (a) {
      var c = document.getElementById('actor-' + a.id);
      c.classList.toggle('dim', msgs.length > 0 && !active[a.id]);
      c.classList.toggle('on', !!active[a.id]);
    });
    var old = document.querySelector('.empty-cast'); if (old) old.remove();
    if (!msgs.length) {
      var hint = el('div', 'empty-cast', s.boardHint || 'Press Next → to watch the first step.');
      board.appendChild(hint);
      return;
    }

    var top = cardBottom + 56, bottom = H - 36;
    var gap = Math.min(110, Math.max(58, (bottom - top) / Math.max(1, msgs.length - 1 || 1)));
    if (msgs.length === 1) gap = 0;
    var used = gap * (msgs.length - 1);
    var y0 = top + Math.max(0, ((bottom - top) - used) / 2.6);

    msgs.forEach(function (m, k) {
      var kind = m.kind || 'main';
      var x1 = xs[actorIndex[m.from]], x2 = xs[actorIndex[m.to]];
      var y = y0 + k * gap;
      var dir = x2 >= x1 ? 1 : -1;
      var g = svg('g', { class: 'msg' + (m.code ? ' has-code' : '') + (sel >= 0 && sel !== k ? ' cold' : ''), 'data-k': k });
      var start = x1 + dir * 8, end = x2 - dir * 10;
      var path = svg('path', { d: 'M' + start + ' ' + y + ' L' + end + ' ' + y, class: 'wire ' + kind, 'marker-end': 'url(#arr-' + kind + ')' });
      g.appendChild(path);
      var mid = (x1 + x2) / 2;
      var label = svg('text', { x: mid, y: y - 17, 'text-anchor': 'middle', class: 'wlabel ' + kind });
      label.textContent = m.label;
      g.appendChild(label);
      var badge = svg('g', { class: 'badge ' + kind, transform: 'translate(' + x1 + ' ' + y + ')' });
      badge.appendChild(svg('circle', { r: 11 }));
      var t = svg('text', { 'text-anchor': 'middle', dy: '4' }); t.textContent = String(k + 1);
      badge.appendChild(t);
      g.appendChild(badge);
      g.addEventListener('mouseenter', function () { heat(k); });
      g.addEventListener('mouseleave', function () { heat(sel); });
      if (m.code) g.addEventListener('click', function () { select(k); });
      wires.appendChild(g);

      if (animate && !reduce) {
        var len = Math.abs(end - start);
        var dash = kind === 'main' ? '' : path.style.strokeDasharray;
        g.style.opacity = '0';
        setTimeout(function () {
          g.style.transition = 'opacity .25s';
          g.style.opacity = '1';
          if (kind === 'main') {
            path.style.strokeDasharray = len + ' ' + len;
            path.style.strokeDashoffset = String(len);
            path.getBoundingClientRect();
            path.style.transition = 'stroke-dashoffset .5s ease-out';
            path.style.strokeDashoffset = '0';
          }
        }, 120 + k * 380);
      }
    });
  }

  function go(i, fromHash) {
    cur = Math.max(0, Math.min(steps.length - 1, i));
    sel = -1;
    document.querySelector('.stage').classList.remove('wide');
    stepsEl.querySelectorAll('.pill').forEach(function (p, k) { if (k === cur) p.setAttribute('aria-current', 'step'); else p.removeAttribute('aria-current'); });
    var active = stepsEl.children[cur]; if (active && active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    $('prev').disabled = cur === 0;
    $('next').textContent = cur === steps.length - 1 ? 'Start over ↺' : 'Next →';
    $('counter').textContent = cur + ' / ' + (steps.length - 1);
    renderExplain(steps[cur], cur);
    drawWires(true);
    if (!fromHash) { try { history.replaceState(null, '', '#step=' + cur); } catch (e) { location.hash = 'step=' + cur; } }
  }

  // Files dropdown: each step's files, in arrow order, consecutive repeats collapsed.
  var FILE_RE = /([\w.-]+\.(?:dart|kt|kts|swift|java|xml|gradle|ya?ml|json|plist|m|h))\b/;
  function fileOf(m) {
    if (m.code) return m.code.name;
    var x = FILE_RE.exec(m.file || '');
    return x ? x[1] : null;
  }
  var fileChain = [];
  steps.forEach(function (s, i) {
    var files = [];
    (s.messages || []).forEach(function (m, k) {
      var name = fileOf(m);
      if (!name) return;
      var last = files[files.length - 1];
      if (last && last.name === name) { if (!last.code && m.code) { last.k = k; last.code = true; } return; }
      files.push({ name: name, k: k, code: !!m.code });
    });
    if (files.length) fileChain.push({ i: i, label: s.short || s.title, files: files });
  });

  var pop = $('filesPop'), filesBtn = $('filesBtn');
  function renderFiles() {
    pop.innerHTML = '';
    pop.appendChild(el('h3', null, 'Files, in order'));
    pop.appendChild(el('p', 'hint', 'How the flow hops from file to file. Click one to jump to its step and code.'));
    fileChain.forEach(function (g) {
      var box = el('div', 'fgroup' + (g.i === cur ? ' cur' : ''));
      box.appendChild(el('div', 'fstep', 'Step ' + g.i + ' · ' + g.label));
      g.files.forEach(function (f, n) {
        if (n > 0) box.appendChild(el('div', 'fdown', '↓'));
        var b = el('button', 'ffile' + (f.code ? '' : ' no-code'), f.name);
        b.type = 'button';
        b.addEventListener('click', function () {
          closeFiles();
          go(g.i);
          if (f.code) select(f.k);
        });
        box.appendChild(b);
      });
      pop.appendChild(box);
    });
  }
  function openFiles() {
    renderFiles();
    var r = filesBtn.getBoundingClientRect();
    pop.style.top = (r.bottom + 8) + 'px';
    pop.style.left = Math.max(12, Math.min(r.right - 340, window.innerWidth - 352)) + 'px';
    pop.hidden = false;
    filesBtn.setAttribute('aria-expanded', 'true');
  }
  function closeFiles() { pop.hidden = true; filesBtn.setAttribute('aria-expanded', 'false'); }
  function toggleFiles() { if (pop.hidden) openFiles(); else closeFiles(); }
  if (!fileChain.length) filesBtn.hidden = true;
  filesBtn.addEventListener('click', function (e) { e.stopPropagation(); toggleFiles(); });
  pop.addEventListener('click', function (e) { e.stopPropagation(); });
  document.addEventListener('click', function () { if (!pop.hidden) closeFiles(); });

  $('prev').addEventListener('click', function () { go(cur - 1); });
  $('next').addEventListener('click', function () { go(cur === steps.length - 1 ? 0 : cur + 1); });
  document.addEventListener('keydown', function (e) {
    if (e.target && /input|textarea/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); go(cur + 1); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(cur - 1); }
    else if (e.key === 'Home') { go(0); }
    else if (e.key === 'Escape' && !pop.hidden) { closeFiles(); }
    else if (e.key === 'Escape' && sel >= 0) { select(sel); }
    else if ((e.key === 'f' || e.key === 'F') && !filesBtn.hidden) { toggleFiles(); }
    else if (/^[1-9]$/.test(e.key)) { select(Number(e.key) - 1); }
  });
  var rt;
  window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { drawWires(false); }, 120); });
  var m = /step=(\d+)/.exec(location.hash);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawWires(false); });
  go(m ? Number(m[1]) : 0, true);
  var c = /code=(\d+)/.exec(location.hash);
  if (c) select(Number(c[1]) - 1);
  if (/files=1/.test(location.hash) && !filesBtn.hidden) openFiles();
})();
</script>
</body>
</html>
